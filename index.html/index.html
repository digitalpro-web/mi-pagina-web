<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalPro - Productos Digitales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .form-input { width: 100%; padding: 0.75rem 1.25rem; border-radius: 0.75rem; border: 1px solid #e5e7eb; background-color: #f9fafb; transition: all 0.2s; }
        .form-input:focus { outline: none; border-color: #4f46e5; ring: 2px; background-color: #ffffff; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <span class="text-2xl font-bold text-indigo-600">DigitalPro</span>
                <div class="flex space-x-4">
                    <a href="#inicio" class="text-gray-600 hover:text-indigo-600 font-medium">Inicio</a>
                    <a href="#contacto" class="bg-indigo-600 text-white px-4 py-2 rounded-lg shadow-md">Contactar</a>
                </div>
            </div>
        </div>
    </nav>

    <header id="inicio" class="gradient-bg text-white py-24 px-4 text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold mb-6">Transformamos ideas en productos digitales.</h1>
        <p class="text-xl mb-10 text-indigo-100 max-w-3xl mx-auto">Diseñamos experiencias listas para crecer.</p>
    </header>

    <section id="contacto" class="py-24 bg-gray-50">
        <div class="max-w-3xl mx-auto px-4">
            <div class="bg-white rounded-[2.5rem] shadow-2xl p-8 md:p-12">
                <div class="text-center mb-10">
                    <h2 class="text-3xl font-bold">Hablemos de tu proyecto</h2>
                    <p class="text-gray-500 mt-4">Envía tus datos y los recibiremos en nuestro sistema.</p>
                </div>

                <!-- ESTA ES LA CONEXIÓN REAL A TU EXCEL -->
                <form id="contactForm" class="space-y-5" action="https://script.google.com/macros/s/AKfycbzcilARRoknGIvy2gWKUidt9ormAkm9OsWBTjhMWAv9juQL80oqK7gMXfJaKtc9eumk1w/exec" method="POST">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre</label>
                            <input type="text" name="nombre" required placeholder="Tu nombre" class="form-input">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Correo Electrónico</label>
                            <input type="email" name="correo" required placeholder="tu@email.com" class="form-input">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Tipo de Proyecto</label>
                        <select name="tipo" class="form-input">
                            <option value="MVP">Desarrollo MVP</option>
                            <option value="Web">Página Web / App</option>
                            <option value="Consultoria">Consultoría Estratégica</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Mensaje</label>
                        <textarea name="mensaje" rows="4" required placeholder="Cuéntanos tu idea..." class="form-input"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition shadow-lg flex items-center justify-center gap-3">
                        <span>Enviar a mi Excel</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </section>

    <footer class="bg-white py-12 border-t text-center text-gray-500 text-sm">
        © 2026 DigitalPro. Sistema de Captación Automatizado.
    </footer>
</body>
</html>
